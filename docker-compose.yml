# Chạy toàn bộ dự án Fuurin chỉ với: docker compose up
# - mongo:  database + tự seed roles/website lần đầu
# - server: backend FastAPI + Socket.io + Playwright (Chromium)
# - client: frontend React (Vite dev server)

services:
  mongo:
    image: mongo:7
    container_name: fuurin-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./server_python/data:/seed:ro
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fuurin-redis
    restart: unless-stopped
    # appendonly: blacklist token sống sót cả khi container redis khởi động lại.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  embedder:
    build: ./embedder
    container_name: fuurin-embedder
    restart: unless-stopped
    # KHONG mo cong ra host: chi backend trong mang docker goi toi.
    # Model + ONNX Runtime nam o day chu khong o image `server`, nho vay image
    # backend giu nguyen ~1.06GB.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; r=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)); sys.exit(0 if r['status']=='ok' else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 6

  server:
    build: ./server_python
    container_name: fuurin-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedder:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: mongodb://mongo:27017/fuurin
      # Redis giu blacklist token va bo dem rate limit -> dang xuat co hieu
      # luc that su, song sot qua restart backend.
      REDIS_URL: redis://redis:6379/0
      # De trong thi phan xep hang theo ngu nghia tu tat, he thong chuyen
      # sang cham diem thuan luat chu khong bao loi.
      EMBEDDER_URL: http://embedder:8001
      # Loi khuyen bang LLM (docs/12-loi-khuyen-bang-llm.md). De trong thi tinh
      # nang tu tat: endpoint van tra 200 kem `advice: null`, giao dien an the
      # goi y, KHONG co man hinh loi nao. Lay key mien phi:
      #   Gemini: https://aistudio.google.com/apikey
      #   Groq:   https://console.groq.com/keys
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Ten model doi kha nhanh, nen de o day de doi ma khong phai sua code.
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gemini-3.1-flash-lite}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-qwen/qwen3.8-27b}
      # Chay duoc ngay voi secret mac dinh cho dev.
      # Muon dung secret rieng (production): tao file .env o thu muc goc de ghi de.
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev_access_secret_change_in_production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_secret_change_in_production}
      # Khoa ma hoa tin nhan. Xem .env.example — doi khoa la mat lich su chat.
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:-}
      # Danh sach origin duoc phep goi API (phan tach bang dau phay).
      # `client:5173` la origin khi trinh duyet chay ben trong docker network (bo test E2E).
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173,http://client:5173}
      # Gioi han dang ky mac dinh la 60 lan/gio/IP. Bo test API tao hon 100
      # tai khoan moi lan chay tu cung mot IP, nen noi long o moi truong dev.
      # Deploy that: BO dong nay di de dung lai muc mac dinh.
      REGISTER_RATE_LIMIT_MAX: ${REGISTER_RATE_LIMIT_MAX:-100000}
    volumes:
      # Named volume thay vì bind mount: container chạy bằng user thường (uid 10001),
      # bind mount từ host sẽ bị "permission denied" trên Linux.
      - uploads-data:/app/public/uploads
      - certificates-data:/app/public/certificates

  client:
    build: ./client
    container_name: fuurin-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
    # Vite mat vai giay moi phuc vu duoc sau khi container "running".
    # Khong co healthcheck thi bo test E2E co the goto() truoc khi Vite san sang.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

volumes:
  mongo-data:
  redis-data:
  uploads-data:
  certificates-data:
