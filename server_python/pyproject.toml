[project]
name = "fuurin-server"
version = "1.0.0"
# Code dung cu phap union PEP 604 (`str | None`) duoc danh gia luc runtime
# boi Pydantic, nen bat buoc >= 3.10. Docker ghim python:3.12-slim.
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", ".venv", "__pycache__"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # do line-length da xu ly
    "B008",  # Depends(...) trong default arg la dung y cua FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Pattern phai khop duoc du ruff duoc goi tu goc repo hay tu server_python/,
# nen dung "**/" thay vi "tests/*" (cai nay resolve thanh <cwd>/tests/* -> khong khop).
"**/tests/*" = ["F811"]
