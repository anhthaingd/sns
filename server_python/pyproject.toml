[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", ".venv", "__pycache__"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # do line-length da xu ly
    "B008",  # Depends(...) trong default arg la dung y cua FastAPI
]

[tool.ruff.lint.per-file-ignores]
# Test dung fixture qua ten bien -> ruff hay bao nham
"tests/*" = ["F811"]
