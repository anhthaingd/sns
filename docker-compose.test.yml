# Chạy test cho backend Python.
# LUÔN merge với docker-compose.yml để test nằm cùng project & network với stack:
#
#   docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm api-tests
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm e2e-tests
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm \
#       -e RUN_CRAWL_TESTS=1 api-tests python -m pytest tests/test_crawl.py
#
# Luu y: lenh e2e-tests dung lai container `client` de tro vao `server:3000`.
# Chay xong, tra client ve cau hinh thuong bang:  docker compose up -d client

services:
  api-tests:
    build:
      context: ./server_python
      dockerfile: Dockerfile.test
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BASE_URL: http://server:3000
      MONGO_URL: mongodb://mongo:27017/fuurin
      # test_query_count.py nap chinh app FastAPI trong tien trinh test de dem
      # so lenh gui xuong Mongo. Muon dung chung token voi container `server`
      # thi secret va DATABASE_URL phai trung.
      DATABASE_URL: mongodb://mongo:27017/fuurin
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev_access_secret_change_in_production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_secret_change_in_production}
      # Cung ly do: app nap trong tien trinh test phai giai ma duoc nhung tin
      # nhan do container `server` ghi ra, nen phai dung CHUNG khoa.
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:-}
      # test_auth.py kiem tra token da thu hoi duoc ghi vao Redis (trang thai
      # dung chung) chu khong phai RAM tien trinh — do la thu lam cho dang xuat
      # song sot qua restart backend.
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./server_python:/app
      # tests/test_message_codes.py doi chieu danh muc ma cua backend voi file
      # dich cua client. Khong mount thu muc nay thi cac test do bi skip, va
      # them mot ma moi ma quen dich se khong ai biet.
      - ./client/src/i18n/locales:/client/src/i18n/locales:ro
    working_dir: /app
    command: ["python", "-m", "pytest"]

  # E2E chay trinh duyet BEN TRONG docker network, nen frontend phai goi `server:3000`
  # thay vi `localhost:3000` (localhost trong container trinh duyet la chinh container do).
  # Service `client` duoc dung lai voi bien nay khi chay e2e-tests.
  client:
    environment:
      VITE_BACKEND_URL: http://server:3000

  e2e-tests:
    build:
      context: ./e2e
    # Chromium dung /dev/shm lam bo nho cho tab. Mac dinh cua Docker la 64MB,
    # va khi chay het bo test trong mot luot thi tab chet giua chung voi loi
    # "Target crashed" — chay rieng tung test lai qua, nen rat de doc nham
    # thanh loi cua ung dung.
    shm_size: "1gb"
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    environment:
      APP_URL: http://client:5173
      API_URL: http://server:3000
      MONGO_URL: mongodb://mongo:27017/fuurin
      ARTIFACTS_DIR: /artifacts
    volumes:
      - .:/work
      - ./e2e/artifacts:/artifacts
    working_dir: /work
    command: ["python", "-m", "pytest", "e2e", "-c", "e2e/pytest.ini", "-p", "no:cacheprovider"]
