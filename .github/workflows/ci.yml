name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai ruff
        run: pip install ruff==0.15.1

      - name: ruff check
        run: ruff check server_python/app server_python/scripts server_python/tests e2e --config server_python/pyproject.toml

      - name: ruff format --check
        run: ruff format --check server_python/app server_python/scripts server_python/tests e2e --config server_python/pyproject.toml

  test:
    name: Test (API + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Build khong cache: mat ~5 phut (rieng buoc tai Chromium ~340MB).
      # Neu muon nhanh hon co the them docker/bake-action + cache type=gha,
      # nhung buoc do chua duoc kiem chung nen tam thoi giu don gian & chac chan.
      - name: Khoi dong stack
        run: docker compose up -d --build

      - name: Cho backend healthy
        run: |
          for i in $(seq 1 60); do
            health=$(docker inspect -f '{{.State.Health.Status}}' fuurin-server 2>/dev/null || echo starting)
            [ "$health" = "healthy" ] && echo "backend healthy sau ${i}s" && exit 0
            sleep 1
          done
          echo "::error::Backend khong healthy sau 60s"
          docker compose logs server
          exit 1

      # Chay trong image production (image test khong tai binary browser).
      # Bao ve quyet dinh chi tai chromium-headless-shell o Dockerfile.
      - name: Smoke test browser trong image
        run: docker compose exec -T server python -m scripts.browser_smoke

      - name: Test API
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm api-tests

      - name: Test E2E (Playwright)
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm e2e-tests

      - name: Anh chup man hinh khi that bai
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Log backend khi that bai
        if: failure()
        run: docker compose logs --no-color server mongo

      - name: Don dep
        if: always()
        run: docker compose down -v
