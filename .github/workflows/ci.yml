name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai ruff
        run: pip install ruff==0.15.1

      - name: ruff check
        run: ruff check server_python/app server_python/scripts server_python/tests embedder e2e --config server_python/pyproject.toml

      - name: ruff format --check
        run: ruff format --check server_python/app server_python/scripts server_python/tests embedder e2e --config server_python/pyproject.toml

  # Frontend truoc day KHONG duoc CI kiem gi ca: 10.000 dong JSX, khong lint,
  # khong build. Hau qua do duoc: mot bien `Pagination` chua import va mot cho
  # `p?.images[0]` doc sai kieu du lieu da nam trong nhanh main, lam sap ca
  # trang tim kiem — ESLint bao dung ca hai cho tu lau ma khong ai chay.
  lint-client:
    name: Lint + build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npm ci` chu khong phai `npm install`: cai dung theo lock file.
      - name: Cai dependency
        run: npm ci

      # `--max-warnings 37` la con so canh bao hien tai (toan bo la
      # react-hooks/exhaustive-deps). Sua mang phu thuoc co the doi hanh vi
      # runtime nen phai sua tung cho co kiem chung, khong sua hang loat. Chot
      # o day de con so chi duoc GIAM: them canh bao moi la CI do.
      # `npm run lint` chay hai thu: ESLint va `scripts/check-i18n.mjs`.
      # Cai thu hai doi ba file dich (ja/vi/en) phai cung tap khoa va cung tham
      # so. Thieu mot khoa o tieng Viet KHONG lam hong build va KHONG lo ra khi
      # thu bang tieng Nhat — no chi hien ra dung luc demo, nen phai chan o day.
      - name: ESLint + kiem tra file dich
        run: npm run lint

      # Container dang chay bang `npm run dev`, nen neu khong build o day thi
      # khong ai biet ban production co dung duoc hay khong.
      - name: Build production
        run: npm run build

  test:
    name: Test (API + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Build khong cache: mat ~5 phut (rieng buoc tai Chromium ~340MB).
      # Neu muon nhanh hon co the them docker/bake-action + cache type=gha,
      # nhung buoc do chua duoc kiem chung nen tam thoi giu don gian & chac chan.
      - name: Khoi dong stack
        run: docker compose up -d --build

      - name: Cho cac service healthy
        run: |
          # embedder can nap model ONNX nen lau hon backend.
          for container in fuurin-embedder fuurin-server fuurin-client; do
            for i in $(seq 1 180); do
              health=$(docker inspect -f '{{.State.Health.Status}}' "$container" 2>/dev/null || echo starting)
              [ "$health" = "healthy" ] && echo "$container healthy sau ${i}s" && break
              if [ "$i" = "180" ]; then
                echo "::error::$container khong healthy sau 180s"
                docker compose logs "${container#fuurin-}"
                exit 1
              fi
              sleep 1
            done
          done

      # Nap du lieu viec lam tu HTML da luu trong tests/fixtures (KHONG can mang).
      # Khong co buoc nay thi collection `jobs` rong va cac test ve trang viec lam
      # / goi y cong ty bi skip - tuc la CI khong thuc su kiem duoc chuc nang do.
      - name: Nap du lieu mau (offline)
        run: |
          docker compose run --rm server python -m scripts.seed_jobs_from_fixtures
          docker compose run --rm server python -m scripts.seed_resumes --count 40

      # Chay trong image production (image test khong tai binary browser).
      # Bao ve quyet dinh chi tai chromium-headless-shell o Dockerfile.
      - name: Smoke test browser trong image
        run: docker compose exec -T server python -m scripts.browser_smoke

      - name: Test API
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm api-tests

      - name: Test E2E (Playwright)
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm e2e-tests

      - name: Anh chup man hinh khi that bai
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Log backend khi that bai
        if: failure()
        run: docker compose logs --no-color server mongo embedder

      - name: Don dep
        if: always()
        run: docker compose down -v
